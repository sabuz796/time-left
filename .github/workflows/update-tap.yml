name: Update Homebrew Tap

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Download DMG and compute sha256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(gh release view --json tagName --jq .tagName)
          fi
          gh release download "$TAG" --pattern TimeLeft.dmg --dir dmg
          SHA=$(sha256sum dmg/TimeLeft.dmg | cut -d' ' -f1)
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"

      - name: Bump cask in tap repo
        env:
          TAP_KEY: ${{ secrets.TAP_REPO_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key"
          git clone git@github.com:sabuz796/homebrew-tap.git tap
          cd tap
          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" Casks/time-left.rb
          sed -i "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" Casks/time-left.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/time-left.rb
          if git diff --cached --quiet; then
            echo "Cask already up to date"
            exit 0
          fi
          git commit -m "time-left ${VERSION}"
          git push

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write   # needed for the "Trigger tap cask bump" workflow dispatch

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Fail the release before building anything if the calendar/timer math
      # regressed — a tagged release is otherwise irreversible on the tap.
      - name: Run self-check
        run: ./scripts/test.sh

      - name: Build DMG
        run: ./scripts/build-dmg.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/TimeLeft.dmg \
            --title "$GITHUB_REF_NAME — Time Left" \
            --generate-notes

      # GITHUB_TOKEN-created events don't trigger other workflows (anti-recursion),
      # so poke the tap bump explicitly — workflow_dispatch is the documented exception.
      - name: Trigger tap cask bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Update Homebrew Tap" --repo "$GITHUB_REPOSITORY"
